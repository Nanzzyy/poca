# Production stack for Coolify. Coolify proxies the public domains to:
#   - frontend (:3010) — the Next.js app
#   - backend  (:8008) — the FastAPI API (browser fetches via NEXT_PUBLIC_API_URL)
# All ports outside 3000-3007 and 8000 (8000 conflicts on the Coolify host).
# Local dev: `docker compose up -d db redis`, then run backend (uvicorn) + FE (npm run dev) manually.
services:
  backend:
    build: .
    ports:
      - "8008:8008"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tourism}:${POSTGRES_PASSWORD:-tourism}@db:5432/${POSTGRES_DB:-tourism}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-tourism}:${POSTGRES_PASSWORD:-tourism}@db:5432/${POSTGRES_DB:-tourism}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to a strong random value}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_MODEL=${AI_MODEL:-gemini/gemini-2.0-flash}
      # Comma-separated origins. Set to your Coolify domain in production, e.g.
      # CORS_ORIGINS=https://poca.coolify.app
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3010,http://localhost:3000}
      - DEBUG=${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8008/health',timeout=5).status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is build-time — the public URL browsers use to reach the API.
        # Set to your Coolify backend domain in Coolify env, e.g.
        # https://api-poca.coolify.app/api/v1
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8008/api/v1}
    ports:
      - "3010:3010"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourism}
      POSTGRES_DB: ${POSTGRES_DB:-tourism}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourism}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: